name: 🐳 GPU API image (RunPod)

# Builds the `api` stage of docker/Dockerfile.gpu and pushes it to GHCR:
#   ghcr.io/<owner>/vieneu-tts:api-gpu        (latest main)
#   ghcr.io/<owner>/vieneu-tts:api-gpu-<sha>  (pinned)
on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile.gpu"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "apps/**"
      - "config.yaml"
      - ".github/workflows/docker-gpu.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    name: Build & push api-gpu
    runs-on: ubuntu-latest
    steps:
      # CUDA runtime + torch is ~10 GB; the stock runner is short on disk without this.
      - name: 🧹 Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: 🏷️ Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vieneu-tts" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gpu
          target: api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:api-gpu
            ${{ env.IMAGE }}:api-gpu-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
